# ==============================================================================
# KUBERNETES GATEWAY API SPECIFICATION (DC-DR INGRESS TRAFFIC ROUTING)
# Standard: gateway.networking.k8s.io/v1
# Multi-Cloud Support: Envoy Gateway / Istio / Cilium Ingress Controllers
# ==============================================================================

---
# ------------------------------------------------------------------------------
# 1. GATEWAY CLASS DEFINITION (ENVOY GATEWAY CONTROLLER)
# ------------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg-gateway-class
  labels:
    app.kubernetes.io/managed-by: argocd
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---
# ------------------------------------------------------------------------------
# 2. GATEWAY INSTANCE (DC / DR CLUSTER INGRESS LISTENER)
# ------------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: multicloud-gateway
  namespace: default
  labels:
    app.kubernetes.io/name: gateway-api
    environment: production
spec:
  gatewayClassName: eg-gateway-class
  listeners:
    # HTTP Listener on Port 80
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    # HTTPS TLS Listener on Port 443
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: tls-secret-dc-dr
      allowedRoutes:
        namespaces:
          from: All

---
# ------------------------------------------------------------------------------
# 3. HTTPROUTE DEFINITION FOR SPRINGBOOT & NODEJS SERVICES
# ------------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-http-route
  namespace: default
  labels:
    app.kubernetes.io/name: app-http-route
spec:
  parentRefs:
    - name: multicloud-gateway
      sectionName: http
  rules:
    # Rule 1: Java Spring Boot API Traffic Routing (/api/v1/springboot)
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/springboot
      backendRefs:
        - name: java-springboot-service
          port: 8080
          weight: 100

    # Rule 2: Node.js Microservice Traffic Routing (/api/v1/nodejs)
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/nodejs
      backendRefs:
        - name: nodejs-app-service
          port: 3000
          weight: 100
