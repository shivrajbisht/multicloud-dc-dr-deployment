# ==============================================================================
# ARGO ROLLOUTS PROMETHEUS ANALYSIS TEMPLATE (AUTOMATED ROLLBACK ENGINE)
# API Version: argoproj.io/v1alpha1
# Purpose: Queries Prometheus metrics during Canary rollout.
# Trigger: If metrics breach threshold, Argo Rollout aborts and automatically rolls back.
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: prometheus-success-rate-analysis
  namespace: default
  labels:
    app.kubernetes.io/name: prometheus-analysis
spec:
  args:
    - name: service-name

  metrics:
    # --------------------------------------------------------------------------
    # Metric 1: HTTP Request Success Rate (Threshold >= 99.5%)
    # --------------------------------------------------------------------------
    - name: success-rate
      interval: 30s
      successCondition: result[0] >= 0.995
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}", status=~"2.*|3.*"}[2m]))
            /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))

    # --------------------------------------------------------------------------
    # Metric 2: P95 Latency Threshold (Threshold <= 0.250s / 250ms)
    # --------------------------------------------------------------------------
    - name: p95-latency
      interval: 30s
      successCondition: result[0] <= 0.250
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc:9090
          query: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[2m])) by (le))
