# ==============================================================================
# AWS APPLICATION LOAD BALANCER (ALB) INGRESS SPECIFICATION WITH ALL SECURED ANNOTATIONS
# ==============================================================================
# Ingress Controller: AWS Load Balancer Controller (v2.7+)
# Target Mode: IP (Direct EKS Pod IP Routing without kube-proxy double-hop)
# Security Features:
#   - Mandatory HTTP 80 -> HTTPS 443 SSL 301 Redirect
#   - ACM SSL Certificate Auto-Binding
#   - TLS 1.3 / 1.2 Security Policy Enforcement (ELBSecurityPolicy-TLS13-1-2-2021-06)
#   - AWS WAF v2 Security Web ACL Integration
#   - Custom Pod Readiness Health Check Path (/healthz)
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-alb-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: aws-alb-ingress
    environment: production
  annotations:
    # 1. Ingress Class & Scheme Configuration
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    
    # 2. Target Type: IP (Direct Pod IP routing for optimal network performance)
    alb.ingress.kubernetes.io/target-type: ip
    
    # 3. Port Listeners & Mandatory SSL Redirect
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    
    # 4. ACM Certificate Binding & TLS Security Policy
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/abc-12345678-90ab-cdef
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    
    # 5. AWS WAF v2 Web ACL Security Shield Integration
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:us-east-1:123456789012:regional/webacl/waf-dc-prod/abc-123
    
    # 6. Target Group Health Check Settings
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/success-codes: '200-399'
    
    # 7. Access Logging to S3 Bucket
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=s3-alb-logs-dc-dev,idle_timeout.timeout_seconds=60

spec:
  rules:
    - host: app.dc-primary.example.com
      http:
        paths:
          - path: /api/v1/springboot
            pathType: Prefix
            backend:
              service:
                name: java-springboot-service
                port:
                  number: 8080
          - path: /api/v1/nodejs
            pathType: Prefix
            backend:
              service:
                name: nodejs-service
                port:
                  number: 3000
