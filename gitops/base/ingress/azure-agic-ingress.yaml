# ==============================================================================
# AZURE APPLICATION GATEWAY INGRESS CONTROLLER (AGIC) SECURED MANIFEST
# ==============================================================================
# Ingress Controller: AGIC (azure/application-gateway)
# Security Features:
#   - Mandatory HTTP 80 -> HTTPS 443 SSL Redirect
#   - Azure Key Vault SSL Certificate Binding
#   - Azure WAF Policy Integration
#   - Health Probe Path (/healthz)
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azure-agic-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: azure-agic-ingress
    environment: disaster-recovery
  annotations:
    # 1. Ingress Class Selection for AGIC
    kubernetes.io/ingress.class: azure/application-gateway

    # 2. Mandatory SSL Redirect (HTTP 80 -> HTTPS 443)
    appgw.ingress.k8s.io/ssl-redirect: "true"

    # 3. Azure Key Vault SSL Certificate Binding (Stored in App Gateway / Key Vault)
    appgw.ingress.k8s.io/appgw-ssl-certificate: "appgw-keyvault-ssl-cert"

    # 4. Azure WAF Policy Reference
    appgw.ingress.k8s.io/waf-policy-for-path: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-multicloud-dev-01/providers/Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/waf-policy-dr"

    # 5. Backend Protocol & Health Probe
    appgw.ingress.k8s.io/backend-protocol: "http"
    appgw.ingress.k8s.io/health-probe-path: "/healthz"
    appgw.ingress.k8s.io/cookie-based-affinity: "false"
    appgw.ingress.k8s.io/request-timeout: "30"

spec:
  rules:
    - host: app.dr-secondary.example.com
      http:
        paths:
          - path: /api/v1/springboot
            pathType: Prefix
            backend:
              service:
                name: java-springboot-service
                port:
                  number: 8080
          - path: /api/v1/nodejs
            pathType: Prefix
            backend:
              service:
                name: nodejs-service
                port:
                  number: 3000
