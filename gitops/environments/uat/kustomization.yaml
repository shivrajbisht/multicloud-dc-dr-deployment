# ==============================================================================
# GITOPS KUSTOMIZATION - UAT ENVIRONMENT
# ==============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uat

resources:
  - ../../base/gateway-api/gateway-routes.yaml
  - ../../base/argo-rollouts/canary-rollout.yaml
  - ../../base/argo-rollouts/analysis-template.yaml
  - ../../base/kafka/mirrormaker2.yaml
  - ../../base/elasticsearch/es-cluster.yaml

namePrefix: uat-

commonLabels:
  environment: uat
  managed-by: argocd-gitops

images:
  - name: 123456789012.dkr.ecr.us-east-1.amazonaws.com/java-springboot-service
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/java-springboot-service
    newTag: uat-v1.0.0
