# ==============================================================================
# GITHUB ACTIONS WORKFLOW: AUTOMATED TERRAFORM INFRASTRUCTURE DRIFT DETECTION
# ==============================================================================
# Schedule: Runs automatically every night at Midnight (00:00 UTC)
# Triggers: Also triggerable manually via workflow_dispatch
# Purpose:
#   Identifies out-of-band manual changes in AWS & Azure cloud infrastructure.
#   Uses `terraform plan -detailed-exitcode` (Exit Code 2 = Drift Detected).
#   Automatically creates a GitHub Issue & Slack alert when drift occurs.
# ==============================================================================

name: 'Terraform Infrastructure Drift Detection'

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC daily
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment for Drift Detection'
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  detect-drift:
    name: 'Detect Cloud Infrastructure Drift'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Infrastructure Code
        uses: actions/checkout@v4

      - name: 2. Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: 3. Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsDeployerRole
          aws-region: us-east-1

      - name: 4. Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: 00000000-0000-0000-0000-000000000000
          tenant-id: 11111111-1111-1111-1111-111111111111
          subscription-id: 22222222-2222-2222-2222-222222222222

      - name: 5. Execute Drift Detection Script
        id: drift
        continue-on-error: true
        run: |
          TARGET_ENV="${{ github.event.inputs.target_env || 'dev' }}"
          bash cicd/scripts/terraform_drift_detection.sh "${TARGET_ENV}"

      - name: 6. Create GitHub Issue on Drift Detection
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const envName = context.payload.inputs ? context.payload.inputs.target_env : 'dev';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Infrastructure Drift Detected in Environment: ${envName.toUpperCase()}`,
              body: `### 🚨 Infrastructure Drift Alert!\n\n` +
                    `Out-of-band manual changes have been detected in live AWS/Azure resources for environment: **${envName}**.\n\n` +
                    `Please inspect the workflow run logs and execute \`terraform apply\` to reconcile the live cloud resources back to declared code.`,
              labels: ['drift-detection', 'bug', 'security']
            })
