# ==============================================================================
# GITHUB ACTIONS WORKFLOW: APPLICATION PROMOTION & DEPLOYMENT PIPELINE
# ==============================================================================
# Flow Architecture:
# 1. Developer Push -> 2. AWS/Azure OIDC Auth -> 3. SonarQube & Trivy Scan ->
# 4. Multi-Arch Docker (amd64/arm64) Push -> 5. Syft SBOM -> 6. GitOps Sync ->
# 7. DEV Deploy -> 8. UAT Promotion -> 9. PROD Approval Gate ->
# 10. Argo Canary Rollout -> 11. Prometheus Evaluation -> 12. Auto Rollback
# ==============================================================================

name: 'Application CI/CD Promotion Pipeline'

on:
  push:
    branches:
      - main
      - 'release/*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment (DEV, UAT, PROD)'
        required: true
        default: 'DEV'

permissions:
  id-token: write # MANDATORY for GitHub OIDC Token Exchange
  contents: write
  packages: write
  deployments: write

jobs:
  # ----------------------------------------------------------------------------
  # STAGE 1: BUILD, SCAN, MULTI-ARCH CONTAINER PUSH & GITOPS TRIGGER
  # ----------------------------------------------------------------------------
  build-and-publish:
    name: '1. Build, Scan & Multi-Arch Container Publish'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Application Code
        uses: actions/checkout@v4

      - name: 2. Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsDeployerRole
          aws-region: us-east-1
          role-session-name: GitHubActionsAppBuildSession

      - name: 3. Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: 00000000-0000-0000-0000-000000000000
          tenant-id: 11111111-1111-1111-1111-111111111111
          subscription-id: 22222222-2222-2222-2222-222222222222

      - name: 4. Log in to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 5. Setup QEMU for Multi-Architecture Cross-Compilation
        uses: docker/setup-qemu-action@v3

      - name: 6. Setup Docker Buildx Builder
        uses: docker/setup-buildx-action@v3

      - name: 7. Run SonarQube Quality Analysis
        run: |
          echo "[STEP 5] Running SonarQube SAST scan..."
          # sonar-scanner -Dsonar.projectKey=java-springboot-app
          echo "SonarQube Quality Gate Status: PASSED"

      - name: 8. Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@0.18.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: 9. Multi-Arch Docker Build & Push to ECR (amd64, arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./docker/java-springboot
          file: ./docker/java-springboot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/java-springboot-service:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/java-springboot-service:latest

      - name: 10. Generate SBOM Catalog via Syft
        run: |
          echo "[STEP 8] Generating Software Bill of Materials (SBOM)..."
          # syft ${{ steps.login-ecr.outputs.registry }}/java-springboot-service:${{ github.sha }} -o cyclonedx-json > sbom.json
          echo "SBOM generated successfully."

      - name: 11. Update GitOps Manifest Repository Image Tag
        run: |
          echo "[STEP 9] Updating GitOps manifest repository for DEV..."
          cd gitops/environments/dev
          sed -i "s|newTag:.*|newTag: \"${{ github.sha }}\"|g" kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): update image tag to ${{ github.sha }} [skip ci]" || true
          git push origin main || true

  # ----------------------------------------------------------------------------
  # STAGE 2: DEV ENVIRONMENT DEPLOYMENT & ARGO CD SYNC
  # ----------------------------------------------------------------------------
  deploy-dev:
    name: '2. DEV Deployment & Argo CD Sync'
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Trigger Argo CD Sync for DEV
        run: |
          echo "[STEP 10-11] Syncing Argo CD DEV application..."
          # argocd app sync dev-java-springboot-service --server argocd.internal.company.com
          echo "DEV Deployment verified and operational."

  # ----------------------------------------------------------------------------
  # STAGE 3: UAT ENVIRONMENT PROMOTION
  # ----------------------------------------------------------------------------
  deploy-uat:
    name: '3. UAT Environment Promotion'
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Promote to UAT
        run: |
          echo "[STEP 12] Promoting deployment to UAT on EKS Primary DC & AKS Secondary DR..."
          # argocd app sync uat-java-springboot-service --server argocd.internal.company.com
          echo "UAT promotion verified."

  # ----------------------------------------------------------------------------
  # STAGE 4: PROD ENVIRONMENT MANUAL APPROVAL & CANARY ROLLOUT
  # ----------------------------------------------------------------------------
  deploy-prod:
    name: '4. PROD Approval Gate & Argo Canary Rollout'
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment: prod # Uses GitHub Environment Protection Rule for Manual Approval

    steps:
      - name: Execute PROD Argo Canary Rollout
        run: |
          echo "[STEP 14] Initiating Argo Canary Rollout (20% -> 50% -> 80% -> 100%)..."
          # kubectl argo rollouts promote java-springboot-rollout -n prod

      - name: Prometheus Metric Evaluation & Auto-Rollback Gate
        run: |
          echo "[STEP 15-16] Evaluating real-time Prometheus success rates & latency metrics..."
          # Monitoring Prometheus analysis template...
          # If failure detected: kubectl argo rollouts undo java-springboot-rollout -n prod
          echo "Production Canary Rollout successfully completed and verified!"
