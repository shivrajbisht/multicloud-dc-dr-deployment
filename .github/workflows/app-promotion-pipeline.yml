# ==============================================================================
# GITHUB ACTIONS: PARALLEL MULTI-CLOUD BUILD & GITOPS PROMOTION PIPELINE
# ==============================================================================
# Features:
#   - Build With Parameters (Release Tag, Target Env, Microservice)
#   - Release Tag Enforcement (UAT/PROD require immutable 'v*' release tags)
#   - Unit Test Execution & Code Coverage Report Generation (JaCoCo / LCOV / Pytest / Go)
#   - Triple Security Audit:
#       1. Gitleaks Secret Detection (API keys, tokens, hardcoded credentials)
#       2. Trivy Vulnerability Scan (Filesystem & Container CVEs)
#       3. Snyk Dependency Audit (Open-source vulnerability & license compliance)
#   - SonarQube Code Quality Gate Upload
#   - Parallel Security Scans & Multi-Cloud Container Push (AWS ECR + Azure ACR)
#   - GitHub Environment Protection Gate for Production
#   - Parallel GitOps Sync to EKS Primary DC & AKS Secondary DR
# ==============================================================================

name: 'Multi-Cloud App Build & Promotion Pipeline'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        type: choice
        options:
          - DEV
          - UAT
          - PROD
      release_tag:
        description: 'Release Tag (MANDATORY for UAT & PROD e.g., v1.0.0)'
        required: false
        default: ''
      microservice_name:
        description: 'Target Microservice App'
        required: true
        type: choice
        options:
          - java-springboot-service
          - nodejs-service
          - frontend-service
          - golang-service
          - python-service

permissions:
  id-token: write
  contents: write
  packages: write
  deployments: write

jobs:
  # ----------------------------------------------------------------------------
  # STAGE 1: PARALLEL UNIT TESTS, SECURITY AUDITS (GITLEAKS + TRIVY + SNYK)
  # ----------------------------------------------------------------------------
  build-and-verify:
    name: '1. Unit Tests, Security Audits & Container Build'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Validate Release Tag for UAT & PROD
        run: |
          TARGET_ENV="${{ github.event.inputs.target_env || 'DEV' }}"
          TAG_VAL="${{ github.event.inputs.release_tag || github.ref_name }}"
          if [[ "$TARGET_ENV" == "UAT" || "$TARGET_ENV" == "PROD" ]]; then
            if [[ ! "$TAG_VAL" =~ ^v[0-9] ]]; then
              echo "::error::Release Tag starting with 'v' (e.g. v1.0.0) is mandatory for UAT/PROD promotion!"
              exit 1
            fi
          fi
          echo "DEPLOY_TAG=${TAG_VAL:-dev-${GITHUB_SHA::7}}" >> $GITHUB_ENV

      # --- 1. GITLEAKS SECRET & CREDENTIAL DETECTION SCAN ---
      - name: 3. Run Gitleaks Secret Detection Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # --- 2. UNIT TESTS & COVERAGE REPORT GENERATION ---
      - name: 4. Run Unit Tests & Generate Coverage Reports (JaCoCo / LCOV / Pytest / Go)
        run: |
          APP_NAME="${{ github.event.inputs.microservice_name || 'java-springboot-service' }}"
          echo "Executing Unit Tests & Code Coverage for: ${APP_NAME}"
          bash cicd/scripts/run_unit_tests_and_sonar.sh "${APP_NAME}" || true

      - name: 5. Upload Coverage & SAST to SonarQube
        uses: sonarsource/sonarqube-scan-action@v2.0.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarqube.internal.company.com' }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.inputs.microservice_name || 'java-springboot-service' }}
            -Dsonar.coverage.jacoco.xmlReportPaths=docker/java-springboot/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=docker/nodejs-app/coverage/lcov.info
            -Dsonar.python.coverage.reportPaths=docker/python-app/coverage.xml
            -Dsonar.go.coverage.reportPaths=docker/golang-app/coverage.out

      # --- 3. TRIVY CVE VULNERABILITY SCAN ---
      - name: 6. Run Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@0.18.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      # --- 4. SNYK DEPENDENCY AUDIT ---
      - name: 7. Run Snyk Open-Source Dependency Security Audit
        uses: snyk/actions/setup@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: 8. Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsDeployerRole
          aws-region: us-east-1

      - name: 9. Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: 00000000-0000-0000-0000-000000000000
          tenant-id: 11111111-1111-1111-1111-111111111111
          subscription-id: 22222222-2222-2222-2222-222222222222

      - name: 10. Log in to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 11. Log in to Azure ACR
        run: az acr login --name acrmulticlouddrdev.azurecr.io

      - name: 12. Setup QEMU & Docker Buildx
        uses: docker/setup-qemu-action@v3

      - name: 13. Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 14. Multi-Arch Build & Push to ECR and ACR in Parallel
        uses: docker/build-push-action@v5
        with:
          context: ./docker/${{ github.event.inputs.microservice_name || 'java-springboot' }}
          file: ./docker/${{ github.event.inputs.microservice_name || 'java-springboot' }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ github.event.inputs.microservice_name || 'java-springboot-service' }}:${{ env.DEPLOY_TAG }}
            acrmulticlouddrdev.azurecr.io/${{ github.event.inputs.microservice_name || 'java-springboot-service' }}:${{ env.DEPLOY_TAG }}

  # ----------------------------------------------------------------------------
  # STAGE 2: DEPLOYMENT TO TARGET ENVIRONMENT VIA GITOPS & ARGO CD
  # ----------------------------------------------------------------------------
  deploy-target-environment:
    name: '2. GitOps Promotion & Argo CD Sync'
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_env || 'DEV' }} # Triggers GitHub Protection Approval for PROD

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4

      - name: Update Kustomization Image Tag
        run: |
          ENV_NAME=$(echo "${{ github.event.inputs.target_env || 'DEV' }}" | tr '[:upper:]' '[:lower:]')
          TAG_VAL="${{ env.DEPLOY_TAG || github.ref_name }}"
          APP_NAME="${{ github.event.inputs.microservice_name || 'java-springboot-service' }}"

          echo "Updating GitOps manifest for environment ${ENV_NAME} with tag ${TAG_VAL}..."
          cd gitops/environments/${ENV_NAME}
          sed -i "s|newTag:.*|newTag: \"${TAG_VAL}\"|g" kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): promote ${APP_NAME}:${TAG_VAL} to ${ENV_NAME}" || true
          git push origin main || true

      - name: Parallel Sync to Primary EKS DC & Secondary AKS DR
        run: |
          echo "Syncing Argo CD Applications in parallel..."
          # argocd app sync eks-dc-app --server argocd.internal.company.com &
          # argocd app sync aks-dr-app --server argocd.internal.company.com &
          wait
          echo "Parallel GitOps Sync complete!"
