# ==============================================================================
# GITLEAKS CONFIGURATION (SECRET & HARDCODED CREDENTIAL SCANNING)
# ==============================================================================

title = "Enterprise Multi-Cloud DC-DR Gitleaks Rules"

[allowlist]
description = "Global allowlist for example placeholders in documentation"
regexes = [
  '''123456789012''', # Example AWS Account ID
  '''00000000-0000-0000-0000-000000000000''', # Example Azure Subscription ID
  '''11111111-1111-1111-1111-111111111111''',
  '''22222222-2222-2222-2222-222222222222''',
  '''vpc-0a1b2c3d4e5f67890''',
  '''subnet-01111111111111111'''
]
paths = [
  '''\.gitignore''',
  '''README\.md''',
  '''terraform/environments/dev/terraform\.tfvars\.example'''
]
